<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rajasthan Pokémon Atlas - 50 Districts & Counterparts</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        .pokemon-img {
            transition: transform 0.3s ease;
        }
        .district-card:hover .pokemon-img {
            transform: scale(1.15) translateY(-5px);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-50 via-orange-50 to-red-100 min-h-screen text-slate-800">

    <!-- Header -->
    <header class="bg-gradient-to-r from-amber-700 via-orange-600 to-red-700 text-white shadow-xl py-8 px-4 mb-8 text-center relative overflow-hidden">
        <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:16px_16px]"></div>
        <div class="max-w-5xl mx-auto relative z-10">
            <span class="bg-amber-500/30 text-amber-100 text-xs font-bold uppercase tracking-widest px-3 py-1 rounded-full border border-amber-300/30">Royal Edition</span>
            <h1 class="text-4xl md:text-5xl font-extrabold mt-3 tracking-tight">Rajasthan Pokémon Atlas</h1>
            <p class="text-amber-100 mt-2 text-sm md:text-base max-w-2xl mx-auto">Exploring Rajasthan's rich culture, geography, and heritage paired with official Pokémon counterparts across all districts.</p>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 pb-16">
        
        <!-- Search & Filters Toolbar -->
        <div class="bg-white/80 backdrop-blur-md rounded-2xl shadow-md p-4 md:p-6 mb-8 border border-orange-200/50 flex flex-col md:flex-row gap-4 items-center justify-between">
            <!-- Search Bar -->
            <div class="w-full md:w-1/3 relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">🔍</span>
                <input type="text" id="searchInput" placeholder="Search district or Pokémon..." 
                    class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500 text-sm">
            </div>

            <!-- Filters -->
            <div class="w-full md:w-auto flex flex-wrap gap-3 items-center justify-end">
                <select id="divisionFilter" class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500">
                    <option value="">All Divisions</option>
                    <option value="Jaipur Division">Jaipur Division</option>
                    <option value="Jodhpur Division">Jodhpur Division</option>
                    <option value="Udaipur Division">Udaipur Division</option>
                    <option value="Bikaner Division">Bikaner Division</option>
                    <option value="Ajmer Division">Ajmer Division</option>
                    <option value="Kota Division">Kota Division</option>
                    <option value="Bharatpur Division">Bharatpur Division</option>
                </select>

                <select id="typeFilter" class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500">
                    <option value="">All Types</option>
                    <option value="Fire">Fire</option>
                    <option value="Water">Water</option>
                    <option value="Grass">Grass</option>
                    <option value="Psychic">Psychic</option>
                    <option value="Fighting">Fighting</option>
                    <option value="Ground">Ground</option>
                    <option value="Rock">Rock</option>
                    <option value="Steel">Steel</option>
                    <option value="Ghost">Ghost</option>
                    <option value="Flying">Flying</option>
                    <option value="Normal">Normal</option>
                </select>

                <span id="resultCount" class="text-xs font-semibold text-slate-500 bg-orange-100 px-3 py-2 rounded-xl">Showing 46 Districts</span>
            </div>
        </div>

        <!-- Districts Grid -->
        <div id="districtGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Cards injected via JS -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16">
            <p class="text-2xl text-slate-400 font-medium">No districts found matching your criteria.</p>
        </div>

    </main>

    <!-- Detail Modal -->
    <div id="detailModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 md:p-8 shadow-2xl relative transform transition-all scale-95 opacity-0" id="modalContentBox">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 bg-slate-100 hover:bg-slate-200 w-9 h-9 rounded-full flex items-center justify-center font-bold transition">✕</button>
            
            <div class="flex items-center gap-4 mb-6">
                <div class="w-24 h-24 bg-orange-50 rounded-2xl flex items-center justify-center border border-orange-100 shadow-inner">
                    <img id="modalImg" src="" alt="Pokémon" class="w-20 h-20 object-contain">
                </div>
                <div>
                    <span id="modalDivision" class="text-xs font-bold text-orange-600 uppercase tracking-widest bg-orange-100 px-2.5 py-1 rounded-full"></span>
                    <h2 id="modalDistrict" class="text-2xl font-bold text-slate-800 mt-2"></h2>
                    <p id="modalPokemon" class="text-sm font-semibold text-slate-600"></p>
                </div>
            </div>

            <div class="space-y-4">
                <div>
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Type</h4>
                    <span id="modalTypeBadge" class="inline-block px-3 py-1 rounded-full text-xs font-bold text-white"></span>
                </div>
                <div>
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Cultural & Geographic Synergy</h4>
                    <p id="modalDesc" class="text-sm text-slate-600 leading-relaxed"></p>
                </div>
            </div>

            <div class="mt-8 pt-4 border-t border-slate-100 flex justify-end">
                <button onclick="closeModal()" class="bg-slate-800 hover:bg-slate-900 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition">Close</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Data & Logic -->
    <script>
        const districtsData = [
            // Jaipur Division
            { name: "Jaipur", division: "Jaipur Division", pokemon: "Gallade", type: "Psychic", dexId: 475, desc: "The royal 'Pink City' matches Gallade's knightly, elegant, and noble pink aesthetic." },
            { name: "Alwar", division: "Jaipur Division", pokemon: "Arcanine", type: "Fire", dexId: 59, desc: "Home to the famous Sariska Tiger Reserve, making a fire-type tiger companion a natural fit." },
            { name: "Dausa", division: "Jaipur Division", pokemon: "Cubone", type: "Ground", dexId: 104, desc: "Known for its rugged ancient hills and architectural history like the Abhaneri stepwell." },
            { name: "Jhunjhunu", division: "Jaipur Division", pokemon: "Bronzong", type: "Steel", dexId: 437, desc: "Famous for its historic Shekhawati havelis and rich copper-mining heritage." },
            { name: "Sikar", division: "Jaipur Division", pokemon: "Shiftry", type: "Grass", dexId: 275, desc: "Surrounded by semi-arid hills and vibrant desert folklore." },
            { name: "Khairthal-Tijara", division: "Jaipur Division", pokemon: "Bunnelby", type: "Normal", dexId: 659, desc: "A rapidly growing agricultural and industrial hub near the national capital region." },
            { name: "Kotputli-Behror", division: "Jaipur Division", pokemon: "Machop", type: "Fighting", dexId: 66, desc: "A bustling industrial corridor filled with hardworking craftsmanship." },
            { name: "Dudu", division: "Jaipur Division", pokemon: "Sudowoodo", type: "Rock", dexId: 185, desc: "A quirky, standalone landscape symbol of unique rural administrative setups." },

            // Jodhpur Division
            { name: "Jaisalmer", division: "Jodhpur Division", pokemon: "Sandshrew", type: "Ground", dexId: 27, desc: "The Golden City deep in the heart of the Thar Desert, surrounded by rolling sand dunes." },
            { name: "Jodhpur", division: "Jodhpur Division", pokemon: "Greninja", type: "Water", dexId: 658, desc: "The iconic 'Blue City' with majestic blue houses and forts matches the swift ninja aesthetic." },
            { name: "Barmer", division: "Jodhpur Division", pokemon: "Camerupt", type: "Fire", dexId: 323, desc: "A major desert terrain known for oil fields, folk culture, and high temperatures." },
            { name: "Pali", division: "Jodhpur Division", pokemon: "Rhyhorn", type: "Rock", dexId: 111, desc: "Known for industrial textile production and rocky terrain." },
            { name: "Jalore", division: "Jodhpur Division", pokemon: "Golem", type: "Rock", dexId: 76, desc: "Famed for its massive granite quarries and rocky hills." },
            { name: "Sirohi", division: "Jodhpur Division", pokemon: "Abomasnow", type: "Grass", dexId: 460, desc: "Home to Mount Abu, Rajasthan's only hill station with cooler climes." },
            { name: "Phalodi", division: "Jodhpur Division", pokemon: "Cramorant", type: "Flying", dexId: 845, desc: "Famed for Khichan village, a global sanctuary for Demoiselle cranes." },
            { name: "Balotra", division: "Jodhpur Division", pokemon: "Magcargo", type: "Fire", dexId: 219, desc: "Known for textile dyeing, block printing, and hot desert winds." },

            // Udaipur Division
            { name: "Udaipur", division: "Udaipur Division", pokemon: "Milotic", type: "Water", dexId: 350, desc: "The romantic 'City of Lakes' with stunning palaces calls for the most graceful water Pokémon." },
            { name: "Chittorgarh", division: "Udaipur Division", pokemon: "Aegislash", type: "Steel", dexId: 681, desc: "The land of legendary valor, supreme sacrifice, and the invincible Chittorgarh Fort." },
            { name: "Banswara", division: "Udaipur Division", pokemon: "Exeggutor", type: "Grass", dexId: 103, desc: "Known as the 'City of Hundred Islands' with tropical greenery and teak forests." },
            { name: "Dungarpur", division: "Udaipur Division", pokemon: "Lotad", type: "Water", dexId: 270, desc: "A picturesque hilly district with rich tribal heritage and water bodies." },
            { name: "Pratapgarh", division: "Udaipur Division", pokemon: "Scyther", type: "Bug", dexId: 123, desc: "Surrounded by dense forest terrain and the home of traditional Thewa art." },
            { name: "Rajsamand", division: "Udaipur Division", pokemon: "Bastiodon", type: "Rock", dexId: 411, desc: "Home to the mighty Kumbhalgarh Fort, featuring the second-longest continuous wall." },
            { name: "Salumbar", division: "Udaipur Division", pokemon: "Trevenant", type: "Ghost", dexId: 709, desc: "A densely forested and hilly tract rich in natural flora." },

            // Bikaner Division
            { name: "Bikaner", division: "Bikaner Division", pokemon: "Hippopotas", type: "Ground", dexId: 449, desc: "Home to the majestic Junagadh Fort and famous for its desert climate and camel heritage." },
            { name: "Churu", division: "Bikaner Division", pokemon: "Darmanitan", type: "Fire", dexId: 555, desc: "Noted for extreme weather shifts—blistering summers and freezing winters." },
            { name: "Sri Ganganagar", division: "Bikaner Division", pokemon: "Tropius", type: "Grass", dexId: 357, desc: "The 'Food Bowl of Rajasthan,' transformed into a lush green agricultural belt by canals." },
            { name: "Hanumangarh", division: "Bikaner Division", pokemon: "Unown", type: "Psychic", dexId: 201, desc: "Home to Kalibangan, an ancient Indus Valley Civilization site filled with historical mysteries." },
            { name: "Anupgarh", division: "Bikaner Division", pokemon: "Gastrodon", type: "Water", dexId: 423, desc: "A productive canal-irrigated border district blending desert and water elements." },

            // Ajmer Division
            { name: "Ajmer", division: "Ajmer Division", pokemon: "Xatu", type: "Psychic", dexId: 178, desc: "A historic spiritual crossroads housing the Dargah Sharif and Pushkar, deeply mystical." },
            { name: "Nagaur", division: "Ajmer Division", pokemon: "Magnemite", type: "Electric", dexId: 81, desc: "Famous for metal craftsmanship, iron tools, and historical Sufi architecture." },
            { name: "Tonk", division: "Ajmer Division", pokemon: "Espeon", type: "Psychic", dexId: 196, desc: "Known as the 'Lucknow of Rajasthan' with grand Nawabi architecture and literary history." },
            { name: "Bhilwara", division: "Ajmer Division", pokemon: "Spinda", type: "Normal", dexId: 327, desc: "The 'Textile City' renowned across the country for its massive spinning and weaving mills." },
            { name: "Beawar", division: "Ajmer Division", pokemon: "Makuhita", type: "Fighting", dexId: 296, desc: "A vibrant trading and industrial town born out of historical British-era cantonment roots." },
            { name: "Didwana-Kuchaman", division: "Ajmer Division", pokemon: "Pyukumuku", type: "Water", dexId: 771, desc: "Famous for its vast saltwater lakes and saline pans." },
            { name: "Kekri", division: "Ajmer Division", pokemon: "Mienfoo", type: "Fighting", dexId: 619, desc: "A developing agricultural and commercial hub with ancient roots." },
            { name: "Shahpura", division: "Ajmer Division", pokemon: "Smeargle", type: "Normal", dexId: 235, desc: "Famed for the unique Phad miniature scroll painting tradition originating from this region." },

            // Kota Division
            { name: "Kota", division: "Kota Division", pokemon: "Alakazam", type: "Psychic", dexId: 65, desc: "Renowned nationwide as India's premier coaching and educational powerhouse." },
            { name: "Bundi", division: "Kota Division", pokemon: "Chatot", type: "Normal", dexId: 441, desc: "Famed for its intricate stepwells, majestic palaces, and stunning artistic miniature wall paintings." },
            { name: "Baran", division: "Kota Division", pokemon: "Zarude", type: "Grass", dexId: 893, desc: "Home to dense foliage, wildlife, and the ancient Bhandadev Temple ruins." },
            { name: "Jhalawar", division: "Kota Division", pokemon: "Roselia", type: "Grass", dexId: 315, desc: "Known for its relatively damp climate, citrus orchards, and lush poppy fields." },

            // Bharatpur Division
            { name: "Sawai Madhopur", division: "Bharatpur Division", pokemon: "Raikou", type: "Electric", dexId: 243, desc: "Home to the world-renowned Ranthambore National Park, famous for its majestic wild tigers." },
            { name: "Bharatpur", division: "Bharatpur Division", pokemon: "Noctowl", type: "Normal", dexId: 163, desc: "Home to Keoladeo National Park, a UNESCO World Heritage site and paradise for migratory birds." },
            { name: "Dholpur", division: "Bharatpur Division", pokemon: "Stonjourner", type: "Rock", dexId: 874, desc: "Famous for its iconic red sandstone quarries used in monumental architecture across India." },
            { name: "Karauli", division: "Bharatpur Division", pokemon: "Houndoom", type: "Dark", dexId: 229, desc: "Rugged ravines, rocky terrain, and the legendary Kaila Devi temple hills." },
            { name: "Deeg", division: "Bharatpur Division", pokemon: "Blastoise", type: "Water", dexId: 9, desc: "Famed for its royal water palaces, complex fountains, and historic fortifications." },
            { name: "Gangapur City", division: "Bharatpur Division", pokemon: "Audino", type: "Normal", dexId: 531, desc: "A bustling regional agricultural and commercial trading hub." }
        ];

        const typeColors = {
            Fire: 'bg-red-500', Water: 'bg-blue-500', Grass: 'bg-green-500', 
            Psychic: 'bg-purple-500', Fighting: 'bg-amber-700', Ground: 'bg-yellow-600', 
            Rock: 'bg-stone-500', Steel: 'bg-slate-500', Ghost: 'bg-indigo-600', 
            Flying: 'bg-sky-400', Normal: 'bg-zinc-400', Bug: 'bg-lime-600', Electric: 'bg-amber-400', Dark: 'bg-neutral-800'
        };

        const grid = document.getElementById('districtGrid');
        const searchInput = document.getElementById('searchInput');
        const divisionFilter = document.getElementById('divisionFilter');
        const typeFilter = document.getElementById('typeFilter');
        const resultCount = document.getElementById('resultCount');
        const emptyState = document.getElementById('emptyState');

        function renderDistricts(data) {
            grid.innerHTML = '';
            if (data.length === 0) {
                emptyState.classList.remove('hidden');
                resultCount.textContent = `Showing 0 Districts`;
                return;
            }
            emptyState.classList.add('hidden');
            resultCount.textContent = `Showing ${data.length} Districts`;

            data.forEach(item => {
                const spriteUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${item.dexId}.png`;
                const typeColor = typeColors[item.type] || 'bg-slate-500';

                const card = document.createElement('div');
                card.className = "district-card glass-card rounded-2xl p-5 shadow-sm hover:shadow-xl transition-all duration-300 border border-orange-100 flex flex-col justify-between cursor-pointer group";
                card.onclick = () => openModal(item, spriteUrl, typeColor);

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-3">
                            <span class="text-xs font-semibold text-orange-600 bg-orange-100 px-2.5 py-1 rounded-full">${item.division.replace(' Division', '')}</span>
                            <span class="text-xs font-bold text-white ${typeColor} px-2.5 py-0.5 rounded-full shadow-xs">${item.type}</span>
                        </div>
                        <h3 class="text-xl font-bold text-slate-800 group-hover:text-orange-600 transition">${item.name}</h3>
                    </div>
                    <div class="my-4 flex justify-center items-center h-32 bg-orange-50/50 rounded-xl group-hover:bg-orange-100/50 transition">
                        <img src="${spriteUrl}" alt="${item.pokemon}" class="pokemon-img h-28 w-28 object-contain drop-md" loading="lazy" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${item.dexId}.png'">
                    </div>
                    <div>
                        <div class="flex items-center justify-between text-sm">
                            <span class="font-bold text-slate-700">${item.pokemon}</span>
                            <span class="text-xs text-slate-400">#${item.dexId}</span>
                        </div>
                        <p class="text-xs text-slate-500 mt-1 line-clamp-2">${item.desc}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterData() {
            const query = searchInput.value.toLowerCase();
            const divVal = divisionFilter.value;
            const typeVal = typeFilter.value;

            const filtered = districtsData.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(query) || item.pokemon.toLowerCase().includes(query);
                const matchesDiv = divVal === "" || item.division === divVal;
                const matchesType = typeVal === "" || item.type === typeVal;
                return matchesSearch && matchesDiv && matchesType;
            });

            renderDistricts(filtered);
        }

        searchInput.addEventListener('input', filterData);
        divisionFilter.addEventListener('change', filterData);
        typeFilter.addEventListener('change', filterData);

        // Modal Logic
        const modal = document.getElementById('detailModal');
        const modalContentBox = document.getElementById('modalContentBox');

        function openModal(item, spriteUrl, typeColor) {
            document.getElementById('modalImg').src = spriteUrl;
            document.getElementById('modalDivision').textContent = item.division;
            document.getElementById('modalDistrict').textContent = item.name;
            document.getElementById('modalPokemon').textContent = `${item.pokemon} (#${item.dexId})`;
            
            const badge = document.getElementById('modalTypeBadge');
            badge.textContent = item.type;
            badge.className = `inline-block px-3 py-1 rounded-full text-xs font-bold text-white ${typeColor}`;
            
            document.getElementById('modalDesc').textContent = item.desc;

            modal.classList.remove('hidden');
            setTimeout(() => {
                modalContentBox.classList.remove('scale-95', 'opacity-0');
                modalContentBox.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            modalContentBox.classList.remove('scale-100', 'opacity-100');
            modalContentBox.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        // Initial render
        renderDistricts(districtsData);
    </script>
</body>
</html>
